name: Live Minecraft Server Status

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  check-server:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Direct Minecraft status check
        env:
          STATUS_HOSTS: s1strength.mcsh.io,144.31.46.15:12565
        run: node status-check.mjs

      - name: Publish status to GitHub Pages
        run: |
          cp status.json /tmp/status.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp /tmp/status.json status.json
          git add status.json

          git diff --cached --quiet && exit 0
          git commit -m "Update live server status"
          git push origin HEAD:main
