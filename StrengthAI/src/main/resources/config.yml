# StrengthAI 1.0.0
ai:
  enabled: true
  endpoint: "https://openrouter.ai/api/v1/chat/completions"
  model: "openrouter/auto"
  referer: "https://ndmcgamer320-commits.github.io/strenght-smp/"
  title: "Strength SMP AI"
  timeout-seconds: 25
  cooldown-seconds: 20
  join-review: true
  review-score: 35
  reset-confidence: 0.85
  punish-confidence: 0.93
  ban-score: 90
  max-evidence-characters: 7000
  max-output-tokens: 1200

web:
  enabled: true
  host: "0.0.0.0"
  port: 8080
  token: ""
  cors-origin: "*"

fair-bans:
  enabled: true
  auto-ban: true
  min-ai-confidence: 0.98
  min-score: 150
  min-independent-signals: 3
  min-grim-flags: 8
  min-hard-grim-flags: 20
  min-hard-grim-check-flags: 12
  join-grace-seconds: 120
  min-tps: 19.0
  kick-confidence: 0.99
  kick-score: 70
  reset-confidence: 0.95
  reset-score: 80

anti-cheat:
  enabled: true
  auto-actions: true
  movement: true
  combat: true
  reach: true
  mining: true
  spam: true
  bot: true
  automation: true
  notify-admins: true
  spam-window-ms: 6000
  spam-max-messages: 6
  max-horizontal-speed: 0.72
  max-air-y-delta: 1.25
  max-reach: 4.15
  aim-mismatch-degrees: 70.0
  same-target-fast-hits: 12
  inventory-move-min-distance: 1.2
  combat-window-ms: 3000
  combat-max-hits: 24
  min-path-repeats: 7
  ore-review-min-blocks: 80
  ore-review-min-valuable: 4
  path-history-size: 120

reset-commands:
  - "strength reset %player%"
  - "kills reset %player%"

punishment:
  ban-command: "ban %player% StrengthAI: %category%"
  kick-command: "kick %player% StrengthAI: %category%"
  mute-command: "mute %player% 10m StrengthAI: spam"

health:
  enabled: true
  log-every-seconds: 60
  low-tps-threshold: 17.0
  pause-ai-below-tps: 14.0

messages:
  prefix: "&8[&bStrengthAI&8] &f"
